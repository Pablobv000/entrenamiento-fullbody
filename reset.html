<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reiniciar caché</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827;margin:0;padding:32px}
.card{max-width:620px;margin:40px auto;background:white;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{margin-top:0}.ok{color:#0f766e;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>Limpiando versión anterior…</h1>
<p id="status">Eliminando caché y Service Worker.</p>
</div>
<script>
(async () => {
  const status = document.getElementById('status');
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    status.textContent = 'Limpieza completada. Abriendo la app actualizada…';
    status.className = 'ok';
    setTimeout(() => location.replace('./?fresh=20260904-3'), 1000);
  } catch (e) {
    status.textContent = 'Recarga esta página una vez más y vuelve a intentarlo.';
  }
})();
</script>
</body>
</html>
